name: Run Exoplanet Discovery Pipeline

# Controls when the action runs
on:
  schedule:
    - cron: '0 0 * * 1'  # Runs automatically every Monday at midnight UTC
  workflow_dispatch:     # Allows you to also trigger the run manually with a single click

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Gives the script permission to save the CSV file back into your GitHub repo

    steps:
    - name: Checkout Repository Data
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Science Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analytics Engine
      run: python pipeline.py

    - name: Commit and Push Updated CSV File
      run: |
        git config --global user.name 'Exoplanet Automation Bot'
        git config --global user.email 'bot@github.com'
        git add habitable_candidates.csv
        git commit -m "Automated update: Refreshed planetary candidate list" || echo "No changes to commit"
        git push
