name: Automated Exoplanet Discovery Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Adjust schedule as needed (e.g., daily)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests astropy matplotlib lightkurve transitleastsquares

      - name: Run Exoplanet Pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Replace 'pipeline.py' with your exact main exoplanet script filename if different
          python pipeline.py

      - name: Commit and Push Updated CSV File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/icecoldcrm-collab/nextearth.git
          
          # 🔄 Safely stash local generated charts/reports, sync with remote, and pop back before committing
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          
          git add habitable_candidates.csv exofop_submission_*.txt transit_chart_*.png || true
          git commit -m "🌌 High-throughput batch update: new exoplanet candidates logged" || echo "No changes to commit"
          git push origin main
