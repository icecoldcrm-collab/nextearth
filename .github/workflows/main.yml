name: High-Throughput Exoplanet Discovery Pipeline

on:
  schedule:
    - cron: '*/5 * * * *' # Maximum frequency: Runs every 5 minutes
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # 🔑 REQUIRED: Grants the workflow write access to push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Science Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lightkurve transitleastsquares matplotlib

      - name: Run Analytics Engine
        env:
          PYTHONUNBUFFERED: "1"
          BATCH_LIMIT: "50"
        run: |
          python pipeline.py

      - name: Commit and Push Updated CSV File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add habitable_candidates.csv exofop_submission_*.txt transit_chart_*.png || true
          git commit -m "🌌 High-throughput batch update: new exoplanet candidates logged" || echo "No changes to commit"
          git push
