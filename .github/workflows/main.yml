name: Automated Exoplanet Discovery Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
              python-version: '3.10'
              cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lightkurve transitleastsquares matplotlib

      - name: Run Analytics Engine
        env:
          PYTHONUNBUFFERED: "1"
          BATCH_LIMIT: "50"
        run: |
          python pipeline.py

      - name: Commit and Push Updated CSV File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/icecoldcrm-collab/nextearth.git
          
          # Synchronize with remote branch before committing to prevent race conditions
          git pull origin main --rebase || echo "No remote changes to pull"
          
          git add habitable_candidates.csv exofop_submission_*.txt transit_chart_*.png || true
          git commit -m "🌌 High-throughput batch update: new exoplanet candidates logged" || echo "No changes to commit"
          git push
