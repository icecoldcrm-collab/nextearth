name: Planet Nine Infrared Motion Detector

on:
  schedule:
    - cron: '0 0 * * 0' # Runs once a week (Sundays at midnight)
  workflow_dispatch: # Allows you to trigger it manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  run-planet-nine-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests astropy matplotlib

      - name: Run Motion Detector & Mapper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python planet_nine_motion_detector.py

      - name: Commit and Push Results and Maps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/icecoldcrm-collab/nextearth.git
          
          # Synchronize with remote branch to prevent race conditions
          git pull origin main --rebase || echo "No remote changes to pull"
          
          git add planet_nine_moving_candidates.csv planet_nine_solar_system_map.png || true
          git commit -m "🪐 Planet Nine Pipeline: Updated moving infrared candidates and maps" || echo "No changes to commit"
          git push
