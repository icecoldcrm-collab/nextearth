name: Planet Nine Motion Detection Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily, adjust as needed
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests astropy matplotlib scipy urllib3

      - name: Run Motion Detector & Mapper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python planet_nine_scanner.py

      - name: Commit and Push Results and Maps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/icecoldcrm-collab/nextearth.git
          
          # 🔄 Safely stash local generated files, sync with remote via rebase, and restore
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          
          git add planet_nine_moving_candidates.csv planet_nine_solar_system_map.png || true
          git commit -m "🪐 Planet Nine Pipeline: Updated moving infrared candidates and maps" || echo "No changes to commit"
          git push origin main
